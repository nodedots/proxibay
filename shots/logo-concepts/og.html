<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #151b31;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  /* faint oversized echo, bottom-right */
  .echo {
    position: absolute; right: -200px; bottom: -280px; z-index: 0;
    width: 600px; height: 600px; border-radius: 50%;
    border: 44px solid #1e2746; opacity: 0.6;
  }
  .lockup { display: flex; align-items: center; gap: 36px; position: relative; z-index: 1; }
  .word { color: #f2f2f2; font-size: 104px; font-weight: 600; letter-spacing: -0.025em; }
  .tagline {
    margin-top: 32px; color: #b9bbc1; font-size: 38px; font-weight: 400;
    letter-spacing: -0.01em; position: relative; z-index: 1;
  }
  .tagline .coral { color: #ff5858; font-weight: 600; }
  .domain {
    position: absolute; left: 56px; bottom: 44px;
    color: #9698a2; font-size: 24px; letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="echo"></div>
  <div class="lockup">
    <svg width="180" height="180" viewBox="0 0 64 64">
      <path d="M15 44C15 44 14 36 21 34C24 33 25 30 25 25C25 18 29 14 35 14C41 14 43 18 43 21C47 21 52 22 53 24C52 27 47 27 43 27C43 32 46 36 50 37C46 41 40 44 32 44Z" fill="#f2f2f2"/>
      <line x1="14" y1="50" x2="50" y2="50" stroke="#f2f2f2" stroke-width="5" stroke-linecap="round"/>
      <circle cx="34" cy="20" r="3.5" fill="#ff5858"/>
    </svg>
    <span class="word">Stackduck</span>
  </div>
  <p class="tagline">Give every project a home and a <span class="coral">heartbeat</span>.</p>
  <span class="domain">stackduck.app</span>
</body>
</html>
