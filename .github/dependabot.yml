version: 2
updates:
  # Root workspace (frontend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]

  # NestJS API
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      backend-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
