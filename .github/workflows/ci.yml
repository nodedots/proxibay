name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit dependencies (reports findings)
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
        working-directory: backend
      - name: Signature + encryption vectors
        run: node scripts/unit-check.cjs
        working-directory: backend
      - name: Audit dependencies (reports findings)
        run: npm audit --audit-level=high
        working-directory: backend
